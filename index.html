<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Burn CD</title><meta name="description" content="Burn a mix CD, write a note on it and send it to a friend.">
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<div class="bg" aria-hidden="true"><i class="orn tl"></i><i class="orn br"></i></div>
<h1><img src="logo.png" alt="Burn CD"></h1>
<div id="home"><div class="cd pulse" id="hcd" role="button" tabindex="0" aria-label="Click the CD to burn a mix" title="Click to burn a CD"></div></div>
<div id="stage" hidden>
<div id="dm" title="Click to open or close the lid"></div><div class="cd" id="cd"></div>
<div class="win" id="pl"><div class="tb"><span>CD Player</span></div><div class="pb">
<div class="top"><img id="pa" alt=""><div><b id="pt"></b><br><small id="pr"></small></div><div id="lcd">--:-- / --:--</div></div>
<div class="bar"><i id="pf"></i></div>
<div class="ctl"><button id="bv" title="Previous">⏮</button><button id="bp" title="Play / pause">▶</button><button id="bs" title="Stop">■</button><button id="bn" title="Next">⏭</button><button id="be" title="Take the CD out">⏏ Eject</button><button id="bm" title="Send this CD to a friend">✉ Send</button></div>
<h3 id="tc"></h3><div class="list" id="tl"></div></div></div></div>
<div id="hint" role="status"></div>
<nav id="legal"><a href="privacy.html">Privacy Policy</a>·<a href="copyright.html">Copyright</a></nav>
<div id="ov"></div>
<script src="app.js"></script></body></html>
